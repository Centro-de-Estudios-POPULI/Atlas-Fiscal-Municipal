  // peek del resumen departamental: el valor es el agregado del depto, el puesto es entre los 9
  function renderPeekDept(dp){const rows=byDpto[dp];if(!rows)return;
    const psc=scale(cur),v=agg(rows,cur,yIdx),nv=agg(allRows,cur,yIdx),rk=deptRank(dp,cur,yIdx);
    document.getElementById("pk").innerHTML=`<span class="pk-chip" style="background:${psc.color(v)}"></span>`
      +`<span class="pk-lab">Indicador en pantalla<b>${cur.label}</b></span>`
      +`<span class="pk-val">${fmt(v,cur.unit)}</span>`
      +`<span class="pk-rk">${rk?`Puesto <b>${rk.pos}</b>/${rk.n}`:"Sin dato"}<br>${v!=null&&nv!=null?`vs. país <b>${sgn(v-nv)}</b>`:""}</span>`;}
  // peek nacional: sin puesto ni comparación (el país no se compara consigo mismo), rango de los 343
  function renderPeekNat(){const psc=scale(cur),v=agg(allRows,cur,yIdx);
    document.getElementById("pk").innerHTML=`<span class="pk-chip" style="background:${psc.color(v)}"></span>`
      +`<span class="pk-lab">Indicador en pantalla<b>${cur.label}</b></span>`
      +`<span class="pk-val">${fmt(v,cur.unit)}</span>`
      +`<span class="pk-rk">mín <b>${fmt(psc.min,cur.unit)}</b><br>máx <b>${fmt(psc.max,cur.unit)}</b></span>`;}

  // ════════════════════════════════════════════════════════════════════════
  //  EL REPARTO DE LAS 343, Y LO QUE EL DIBUJO NO PUEDE DECIR (del socioeconómico)
  // ════════════════════════════════════════════════════════════════════════
  const N_BIN=30,clamp=(v,a,b)=>v==null||!isFinite(v)?null:Math.min(b,Math.max(a,v));
  const valDe=(s,ind)=>{const r=DATA[s];return r&&r.s[ind.key]?r.s[ind.key][yIdx]:null;};
  function reparto(){const sc=scale(cur);if(sc.vacio)return null;
    const vs=[];for(const s of SIG){const v=valDe(s,cur);if(v!=null&&!isNaN(v))vs.push([s,v]);}
    if(vs.length<8)return null;
    const lo=sc.lo,hi=sc.hi,paso=(hi-lo)/N_BIN||1,bins=new Array(N_BIN).fill(0);
    for(const [,v] of vs)bins[Math.max(0,Math.min(N_BIN-1,Math.floor((v-lo)/paso)))]++;
    return{sc,vs,lo,hi,paso,bins,tope:Math.max(...bins)};}
  function distribucion(){const el=document.getElementById("dist");if(!el)return;
    const r=reparto();if(!r){el.innerHTML="";setPincel(null);return;}
    const {sc,vs,lo,hi,paso,bins,tope}=r;
    const porBin=Array.from({length:N_BIN},()=>[]);
    for(const [s,v] of vs)porBin[Math.max(0,Math.min(N_BIN-1,Math.floor((v-lo)/paso)))].push([s,v]);
    const W=100,H=34,BASE=H-7,AN=W/N_BIN,x=v=>((v-lo)/(hi-lo))*W;let g="";
    bins.forEach((n,j)=>{const h=n?Math.max(.9,(n/tope)*(BASE-2)):0;
      g+=`<rect x="${(j*AN).toFixed(2)}" y="${(BASE-h).toFixed(2)}" width="${(AN-.22).toFixed(2)}" height="${h.toFixed(2)}" fill="${sc.color(lo+(j+.5)*paso)}"/>`;});
    const marca=(v,cls,txt)=>v==null||!isFinite(v)?"":`<line x1="${x(v).toFixed(2)}" y1="1" x2="${x(v).toFixed(2)}" y2="${BASE}" class="${cls}"/>`
      +`<text x="${Math.min(W-1,Math.max(1,x(v))).toFixed(2)}" y="${H-1.4}" class="dt-ax" text-anchor="${x(v)>W*.7?"end":x(v)<W*.3?"start":"middle"}">${txt}</text>`;
    g+=marca(clamp(sc.pivReal,lo,hi),"dt-pais",sc.pivTipo+" "+fmt(sc.pivReal,cur.unit));
    if(focusDept){const vd=agg(byDpto[focusDept],cur,yIdx);g+=marca(clamp(vd,lo,hi),"dt-dpto",focusDept);}
    if(sel){const v=valDe(sel.properties.sigep,cur);if(v!=null&&isFinite(v)){const px=x(Math.min(hi,Math.max(lo,v)));
      g+=`<polygon class="dt-sel" points="${px-1.7},0 ${px+1.7},0 ${px},2.8"/><line x1="${px}" y1="0" x2="${px}" y2="${BASE}" class="dt-sell"/>`;}}
    bins.forEach((n,j)=>{g+=`<rect class="dt-hit" x="${(j*AN).toFixed(2)}" y="0" width="${AN.toFixed(2)}" height="${BASE}" data-j="${j}"/>`;});
    el.innerHTML=`<div class="dt-t">Cómo se reparten las 343<span>eje del mapa · ${fmt(sc.lo,cur.unit)} a ${fmt(sc.hi,cur.unit)}</span></div>`
      +`<svg class="dt" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>`
      +`<div class="dt-pie">Pasá por una barra —o mantené el dedo— para ver esas entidades encendidas en el mapa</div>`;
    const svg=el.querySelector("svg");
    el.querySelectorAll(".dt-hit").forEach(z=>{const j=+z.dataset.j,lista=porBin[j],a=lo+j*paso,b=lo+(j+1)*paso;
      const encender=ev=>{if(!lista.length){sinTip();return;}setPincel(new Set(lista.map(q=>q[0])));
        svg.querySelectorAll(".dt-hit").forEach(o=>o.classList.toggle("on",o===z));
        const orden=lista.slice().sort((p,q)=>d3.descending(p[1],q[1])),nombres=orden.slice(0,3).map(q=>DATA[q[0]].nombre);
        tip(ev,`${fmt(a,cur.unit)} a ${fmt(b,cur.unit)}`,`${lista.length} ${lista.length===1?"entidad":"entidades"} en este tramo`,
          [...nombres.map(nm=>["",nm]),...(orden.length>3?[["","y "+(orden.length-3)+" más"]]:[])]);};
      const apagar=()=>{sinTip();setPincel(null);svg.querySelectorAll(".dt-hit").forEach(o=>o.classList.remove("on"));};
      z.addEventListener("mousemove",encender);z.addEventListener("mouseleave",apagar);
      z.addEventListener("pointerdown",ev=>{if(ev.pointerType!=="mouse")encender(ev);});
      z.addEventListener("pointerup",ev=>{if(ev.pointerType!=="mouse")apagar();});z.addEventListener("pointercancel",apagar);});}
  function lectura(){const el=document.getElementById("lee");if(!el)return;
    const r=reparto();if(!r){el.innerHTML="";return;}
    const {vs}=r,orden=vs.slice().sort((a,b)=>d3.descending(a[1],b[1])),alto=orden[0],bajo=orden[orden.length-1],nom=s=>DATA[s].nombre,li=[];
    const dif=Math.abs(alto[1]-bajo[1]),difTxt=cur.unit==="%"?fmt(dif,"").trim()+" pp":fmt(dif,cur.unit);
    li.push(`<b>${nom(alto[0])}</b> encabeza con ${fmt(alto[1],cur.unit)} y <b>${nom(bajo[0])}</b> cierra con ${fmt(bajo[1],cur.unit)}: ${difTxt} entre las dos puntas.`);
    const ref=r.sc.pivReal,deRef=r.sc.pivTipo==="mediana"?"de la mediana":r.sc.pivTipo==="cero"?"de cero":"del promedio nacional";
    if(ref!=null&&isFinite(ref)){const arriba=vs.filter(x=>x[1]>ref).length;
      li.push(`<b>${arriba}</b> de ${vs.length} ${arriba===1?"queda":"quedan"} por encima ${deRef} (${fmt(ref,cur.unit)}) en ${YEARS[yIdx]}.`);}
    if(sel){const s=sel.properties.sigep,v=valDe(s,cur);if(v!=null&&isFinite(v)){const rk=rankOf(s);
      li.push(`<b>${DATA[s].nombre}</b> está en el puesto <b>${rk?rk.pos:"—"}</b> de ${rk?rk.n:vs.length}${ref!=null&&isFinite(ref)?`, ${v>ref?"por encima":v<ref?"por debajo":"justo en"} ${deRef}`:""}`
        +` — el puesto 1 es ${cur.dir<0?"el valor más bajo":cur.dir>0?"el valor más alto":"el valor más alto"}.`);}}
    el.innerHTML=`<div class="lee">${li.map(t=>`<p>${t}</p>`).join("")}</div>`;}
  // ── comparar dos indicadores: dispersión + ρ de Spearman ──
  let indB=null;
  function rangos(v){const idx=v.map((x,i)=>[x,i]).sort((a,b)=>a[0]-b[0]),r=new Array(v.length);let i=0;
    while(i<idx.length){let j=i;while(j+1<idx.length&&idx[j+1][0]===idx[i][0])j++;const med=(i+j)/2+1;for(let k=i;k<=j;k++)r[idx[k][1]]=med;i=j+1;}return r;}
  function spearman(xs,ys){if(xs.length<8)return null;const rx=rangos(xs),ry=rangos(ys),n=xs.length,mx=d3.mean(rx),my=d3.mean(ry);
    let num=0,dx=0,dy=0;for(let i=0;i<n;i++){const a=rx[i]-mx,b=ry[i]-my;num+=a*b;dx+=a*a;dy+=b*b;}return dx&&dy?num/Math.sqrt(dx*dy):null;}
  const fmtNum=v=>v==null||isNaN(v)?"—":(v<0?"−":"")+Math.abs(v).toFixed(2).replace(".",",");
  const TODOS=()=>GRUPOS.flatMap(g=>g.indicadores);
  function montarComparar(){const s=document.getElementById("cmp-b");if(!s)return;
    s.innerHTML=`<option value="">Comparar con…</option>`+GRUPOS.map(g=>`<optgroup label="${g.label}">`
      +g.indicadores.filter(i=>i.key!==cur.key).map(i=>`<option value="${i.key}"${indB&&indB.key===i.key?" selected":""}>${i.label}</option>`).join("")+`</optgroup>`).join("");
    s.onchange=()=>{indB=s.value?TODOS().find(i=>i.key===s.value)||null:null;dispersion();};}
  function olvidarComparar(){if(indB&&indB.key===cur.key)indB=null;}
  function radioPob(){const ps=SIG.map(s=>DATA[s].pob&&DATA[s].pob[yIdx]).filter(v=>v>0);
    const lo=Math.log(d3.min(ps)),hi=Math.log(d3.max(ps));return v=>!v||v<=0?0.42:0.32+1.93*((Math.log(v)-lo)/((hi-lo)||1));}
  function dispersion(){const el=document.getElementById("cmp");if(!el)return;
    if(!indB||indB.key===cur.key){el.innerHTML="";return;}
    const scA=scale(cur),pts=[];
    for(const s of SIG){const a=valDe(s,cur),b=valDe(s,indB);if(a==null||b==null||isNaN(a)||isNaN(b))continue;pts.push([s,a,b]);}
    if(pts.length<8){el.innerHTML=`<div class="dt-t">Comparar<span>sin pares suficientes</span></div>`;return;}
    const rad=radioPob(),xa=d3.extent(pts,p=>p[1]),ya=d3.extent(pts,p=>p[2]),W=100,H=88,LX=4,RX=W-3,TY=4,BY=H-11;
    const px=v=>LX+((v-xa[0])/((xa[1]-xa[0])||1))*(RX-LX),py=v=>BY-((v-ya[0])/((ya[1]-ya[0])||1))*(BY-TY);
    const pob=s=>(DATA[s].pob&&DATA[s].pob[yIdx])||0;
    const orden=pts.slice().sort((a,b)=>pob(b[0])-pob(a[0]));let g="";
    for(const [s,a,b] of orden){const es=sel&&sel.properties.sigep===s;
      g+=`<circle class="cmp-p${es?" cmp-sel":""}" data-s="${s}" cx="${px(a).toFixed(2)}" cy="${py(b).toFixed(2)}" r="${(rad(pob(s))*(es?1.35:1)).toFixed(2)}"${es?"":` fill="${scA.color(a)}"`}/>`;}
    const rho=spearman(pts.map(p=>p[1]),pts.map(p=>p[2])),f=Math.abs(rho||0);
    const fuerza=f>=.7?"muy de la mano":f>=.5?"bastante de la mano":f>=.3?"algo de la mano":"casi sin relación",sentido=rho>0?"suben juntos":"cuando uno sube, el otro baja";
    el.innerHTML=`<div class="dt-t">${cur.label} <i>contra</i> ${indB.label}<span>${pts.length} entidades · ${YEARS[yIdx]}</span></div>`
      +`<svg class="cmp" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMin meet">${g}<text x="${LX}" y="${H-3.6}" class="cmp-ax">${fmt(xa[0],cur.unit)}</text><text x="${RX}" y="${H-3.6}" class="cmp-ax" text-anchor="end">${fmt(xa[1],cur.unit)} →</text></svg>`
      +`<div class="dt-pie">↑ ${indB.label} · → ${cur.label} · el tamaño ordena por población, no la mide · tocá una burbuja para señalar esa entidad</div>`
      +`<div class="lee"><p>Van <b>${fuerza}</b>${rho==null?"":" — "+sentido}. <span class="lee-adv">ρ de Spearman ${fmtNum(rho)}, sobre el ORDEN de las ${pts.length} entidades y no sobre los valores. Dice cómo se acompañan, no que uno cause al otro.</span></p></div>`;
    el.querySelectorAll(".cmp-p").forEach(c=>{const s=c.dataset.s;
      c.addEventListener("mousemove",ev=>{c.classList.add("hov");setPincel(new Set([s]));
        tip(ev,DATA[s].nombre,DATA[s].dpto,[[cur.label+" ",fmt(valDe(s,cur),cur.unit)],[indB.label+" ",fmt(valDe(s,indB),indB.unit)],["población ",d3.format(",")(Math.round(pob(s))).replace(/,/g,".")]]);});
      c.addEventListener("mouseleave",()=>{c.classList.remove("hov");sinTip();setPincel(null);});
      c.addEventListener("click",()=>{const ft=F.find(x=>x.properties.sigep===s);if(!ft)return;sel=ft;setPincel(null);drawOver();renderMun(s);termoVuelve();escribirURL(true);});});}
  const repintarFicha=()=>{montarComparar();dispersion();distribucion();lectura();termoVuelve();};

  // ════════════════════════════════════════════════════════════════════════
  //  EL ATLAS SE PUEDE COMPARTIR, BUSCAR Y RECORRER SIN EL RATÓN
  // ════════════════════════════════════════════════════════════════════════
  // ── 1 · el estado vive en la URL: #i=<clave>&g=<gestión>&d=<dpto>&m=<cod_ine> ──
  let _urlQuieta=false,_listo=false;
  function estadoActual(){const e={};if(cur)e.i=cur.key;if(yIdx!==YEARS.length-1)e.g=YEARS[yIdx];
    if(focusDept)e.d=focusDept;if(sel)e.m=DATA[sel.properties.sigep].cod_ine;return e;}
  function escribirURL(empujar){if(_urlQuieta||!_listo)return;const e=estadoActual();
    const q=Object.keys(e).map(k=>k+"="+encodeURIComponent(e[k])).join("&"),url=location.pathname+(q?"#"+q:"");
    if(url===location.pathname+location.hash)return;try{history[empujar?"pushState":"replaceState"](e,"",url);}catch(_){}}
  function leerURL(){const h=location.hash.replace(/^#/,"");if(!h)return null;const e={};
    h.split("&").forEach(p=>{const i=p.indexOf("=");if(i>0)e[p.slice(0,i)]=decodeURIComponent(p.slice(i+1));});
    return Object.keys(e).length?e:null;}
  const esRecarga=()=>{try{const nv=performance.getEntriesByType("navigation")[0];return !!nv&&nv.type==="reload";}catch(_){return false;}};
  function aplicarEstado(e){_urlQuieta=true;
    try{
      const gi=e.g?YEARS.indexOf(+e.g):-1;if(gi>=0&&gi!==yIdx){yIdx=gi;yearChrome();}
      const g=e.i&&GRUPOS.find(x=>x.indicadores.some(y=>y.key===e.i));if(g)setCategory(g.key);
      const ind=e.i&&INDS.find(x=>x.key===e.i);if(ind)select(ind);
      if(e.d&&byDpto[e.d])setDept(e.d);
      const s=e.m&&(porIne[e.m]||(DATA[e.m]?e.m:null));
      if(s){const f=F.find(x=>x.properties.sigep===s);if(f){sel=f;drawOver();renderMun(s);}}else renderSummary();
      if(gi>=0){buildCards();fadeSwap(drawBase);drawOver();termo();renderLamina();}
    }catch(err){console.warn("no se pudo restaurar el estado",err);}
    finally{_urlQuieta=false;}}
  addEventListener("popstate",()=>{const e=leerURL();if(e)aplicarEstado(e);else{sel=null;setDept("");}});

  // ── 2 · buscador ──
  const _norm=t=>(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  function buscarIndicadores(q){const nq=_norm(q).trim();if(nq.length<2)return[];const term=nq.split(/\s+/),res=[];
    GRUPOS.forEach(g=>g.indicadores.forEach(i=>{const heno=_norm(i.label+" "+(i.desc||"")+" "+g.label);
      if(!term.every(t=>heno.includes(t)))return;res.push({i,g,peso:_norm(i.label).includes(nq)?0:1});}));
    return res.sort((a,b)=>a.peso-b.peso).slice(0,30);}
  function irA(key,gkey){const g=GRUPOS.find(x=>x.key===gkey);if(g&&g.key!==curCat.key)setCategory(g.key);
    const ind=INDS.find(x=>x.key===key);if(ind){select(ind);const el=document.querySelector(`.ind[data-k="${key}"]`);if(el)el.scrollIntoView({block:"nearest"});escribirURL(true);}}
  (function montarBuscador(){const inp=document.getElementById("busca"),caja=document.getElementById("busca-res");if(!inp||!caja)return;
    const cerrar=()=>{caja.innerHTML="";caja.hidden=true;};
    inp.addEventListener("input",()=>{const r=buscarIndicadores(inp.value);
      if(!r.length){if(_norm(inp.value).trim().length>=2){caja.innerHTML=`<div class="bs-nada">Nada con «${inp.value}»</div>`;caja.hidden=false;}else cerrar();return;}
      caja.innerHTML=r.map(({i,g})=>`<button class="bs-op" data-k="${i.key}" data-g="${g.key}"><span class="bs-l">${i.label}</span><span class="bs-g">${g.label} · ${i.unit}</span></button>`).join("");
      caja.hidden=false;caja.querySelectorAll(".bs-op").forEach(b=>b.onclick=()=>{irA(b.dataset.k,b.dataset.g);inp.value="";cerrar();inp.blur();});});
    inp.addEventListener("keydown",ev=>{if(ev.key==="Escape"){inp.value="";cerrar();inp.blur();}if(ev.key==="Enter"){const p=caja.querySelector(".bs-op");if(p)p.click();}});
    document.addEventListener("click",ev=>{if(!ev.target.closest(".busca-caja"))cerrar();});})();

  // ── 3 · teclado: ↑↓ indicadores · ←→ [ ] gestiones · Esc · / ──
  addEventListener("keydown",ev=>{const t=ev.target;
    if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable))return;
    if(ev.ctrlKey||ev.metaKey||ev.altKey)return;
    const pos=INDS.findIndex(x=>x.key===cur.key);
    const ir=d=>{const nn=INDS[(pos+d+INDS.length)%INDS.length];if(nn){select(nn);const el=document.querySelector(`.ind[data-k="${nn.key}"]`);if(el)el.scrollIntoView({block:"nearest"});escribirURL(true);}};
    switch(ev.key){
      case "ArrowDown":ev.preventDefault();ir(1);break;
      case "ArrowUp":ev.preventDefault();ir(-1);break;
      case "[":case "ArrowLeft":ev.preventDefault();setYear(yIdx-1);escribirURL(true);break;
      case "]":case "ArrowRight":ev.preventDefault();setYear(yIdx+1);escribirURL(true);break;
      case "Escape":if(sel){ev.preventDefault();sel=null;drawOver();renderSummary();escribirURL(true);}break;
      case "/":ev.preventDefault();{const b=document.getElementById("busca");if(b)b.focus();}break;}});

  let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{layout();setSheet(isMob()?sheetState:"hidden");},120);});
  yearChrome();buildCards();renderCatDrop();updateHints();layout();termo();renderLamina();renderNational();
  if(isMob())setSheet("peek");
  // el estado de la URL se aplica DESPUÉS del primer pintado; recargar empieza limpio
  (function(){const e=leerURL();if(e){if(esRecarga())delete e.m;aplicarEstado(e);}_listo=true;escribirURL(false);})();
});
</script>
