  const wrap=document.getElementById("map-wrap");
  const base=document.getElementById("base"),fade=document.getElementById("fade"),over=document.getElementById("over"),pick=document.getElementById("pick"),catchEl=document.getElementById("catch");
  let bctx,fctx,octx,pctx,proj,W,H,L,R,T,B,idx=new Map();
  function setT(ctx){ctx.setTransform(dpr*zt.k,0,0,dpr*zt.k,dpr*zt.x,dpr*zt.y);}
  // crossfade: congela el mapa actual en #fade, dibuja el nuevo debajo y desvanece el viejo
  function fadeSwap(fn){
    if(!fctx||reduceMo()){fn();return;}
    fctx.setTransform(1,0,0,1,0,0);fctx.clearRect(0,0,fade.width,fade.height);
    try{fctx.drawImage(base,0,0);}catch(_){fn();return;}
    fade.style.transition="none";fade.style.opacity="1";
    fn();
    void fade.offsetWidth;
    fade.style.transition="opacity .45s cubic-bezier(.4,0,.2,1)";fade.style.opacity="0";}
  function drawBase(){const sc=scale(cur);bctx.setTransform(dpr,0,0,dpr,0,0);bctx.clearRect(0,0,W,H);setT(bctx);
    const g=d3.geoPath(proj,bctx);bctx.fillStyle=TH.world;bctx.strokeStyle=TH.worldLine;bctx.lineWidth=.5/zt.k;
    world.forEach(w=>{bctx.beginPath();g(w);bctx.fill();bctx.stroke();});
    F.forEach(f=>{const s=f.properties.sigep,off=focusDept&&DATA[s].dpto!==focusDept;bctx.beginPath();g(f);
      bctx.globalAlpha=off?1:TH.alpha;bctx.fillStyle=off?TH.off:sc.color(valOf(s,cur));bctx.fill();bctx.globalAlpha=1;
      bctx.lineWidth=.45/zt.k;bctx.strokeStyle=off?TH.lineOff:TH.lineOn;bctx.stroke();});
    // la división departamental va ENCIMA de los rellenos, más gruesa que la
    // municipal (2,4×) — es la jerarquía la que se lee, no el color
    bctx.beginPath();g(mallaDepto);
    bctx.lineWidth=1.08/zt.k;bctx.strokeStyle=TH.lineDpto;bctx.lineJoin="round";bctx.stroke();
    etiquetas();}

  // ── LOS NOMBRES APARECEN AL ACERCAR ───────────────────────────────────────
  // El mapa no tenía una sola etiqueta: saber qué municipio se está mirando
  // dependía del hover, y en el teléfono no hay hover. Desde cierto zoom cada
  // municipio con sitio suficiente escribe su nombre.
  //
  // ⚠️ SE DIBUJAN CON LA TRANSFORMACIÓN ANULADA. Si fueran dentro del `setT`,
  //    el texto se escalaría con el zoom y a 12× sería ilegible por gigante. Se
  //    proyecta el centroide a mano (`proj` y después el zoom) y se escribe a
  //    tamaño fijo de pantalla.
  // ⚠️ Y SÓLO SI EL NOMBRE ENTRA en el ancho que ocupa el municipio en pantalla:
  //    con 343 polígonos, escribirlos todos deja una maraña donde no se lee
  //    ninguno. El que no entra no se escribe; para eso está el tooltip.
  // ⚠️ El centroide y el tamaño de cada municipio dependen de `proj`, que se
  //    RECALCULA en cada `layout()` (cambia de tamaño la ventana, cambia la
  //    proyección). Un `d3.geoPath(proj)` creado una sola vez fuera se quedaría
  //    con la proyección de ese instante —al definirse acá arriba, con `proj`
  //    todavía `undefined`—. Se recalculan desde `layout()` y se guardan: son 343
  //    centroides y 343 cajas, y hacerlos en cada repintado se paga en cada rueda
  //    del zoom.
  let sitios=[];
  function medirSitios(){
    const rp=d3.geoPath(proj);
    sitios=F.map(f=>{const b=rp.bounds(f),c=rp.centroid(f);
      return{f,c,w:b[1][0]-b[0][0],h:b[1][1]-b[0][1],
             nombre:(DATA[f.properties.sigep]||{}).nombre||"",
             dpto:(DATA[f.properties.sigep]||{}).dpto};})
      // ★ DE MAYOR A MENOR, y el orden ES la regla de desempate: cuando dos
      //   nombres se pisan gana el que se dibujó primero, así que recorrer por
      //   tamaño hace que el municipio grande conserve su nombre y lo ceda el
      //   chico, que además es el que peor se leería.
      .sort((a,b)=>(b.w*b.h)-(a.w*a.h));}
  function etiquetas(){
    if(!sitios.length)return;
    bctx.setTransform(dpr,0,0,dpr,0,0);
    bctx.font='600 11px "Inter",system-ui,sans-serif';
    bctx.textAlign="center";bctx.textBaseline="middle";
    bctx.lineJoin="round";bctx.miterLimit=2;
    // cajas ya ocupadas. Sin esto «Uyuni» se montaba sobre su vecino y quedaban
    // ilegibles las dos. Comparar contra las ya puestas es barato —nunca pasan
    // de unas decenas, porque el filtro de tamaño descarta casi todas—.
    const puestas=[];
    for(const s of sitios){
      if(focusDept&&s.dpto!==focusDept)continue;
      const anchoPx=s.w*zt.k,altoPx=s.h*zt.k;
      if(anchoPx<34||altoPx<16)continue;
      if(!isFinite(s.c[0]))continue;
      const x=zt.x+s.c[0]*zt.k,y=zt.y+s.c[1]*zt.k;
      if(x<L-40||x>R+40||y<T-20||y>B+20)continue;
      let t=s.nombre;
      if(bctx.measureText(t).width>anchoPx-6){
        // un nombre recortado a la mitad es peor que ninguno: se escribe entero
        // o no se escribe. La excepción son los muy largos, que se acortan.
        if(t.length<14||bctx.measureText(t.slice(0,12)+"…").width>anchoPx-6)continue;
        t=t.slice(0,12)+"…";}
      const mw=bctx.measureText(t).width/2+3,mh=7;
      if(puestas.some(p=>Math.abs(p.x-x)<p.mw+mw&&Math.abs(p.y-y)<p.mh+mh))continue;
      puestas.push({x,y,mw,mh});
      bctx.strokeStyle=TH.etiHalo;bctx.lineWidth=3;bctx.strokeText(t,x,y);
      bctx.fillStyle=TH.eti;bctx.fillText(t,x,y);}
    setT(bctx);}
  function drawPick(){pctx.setTransform(dpr,0,0,dpr,0,0);pctx.clearRect(0,0,W,H);setT(pctx);const g=d3.geoPath(proj,pctx);
    F.forEach((f,i)=>{const c=i+1;pctx.beginPath();g(f);pctx.fillStyle=`rgb(${(c>>16)&255},${(c>>8)&255},${c&255})`;pctx.fill();});}
  function drawOver(){octx.setTransform(dpr,0,0,dpr,0,0);octx.clearRect(0,0,W,H);setT(octx);const g=d3.geoPath(proj,octx);
    if(hov){octx.beginPath();g(hov);octx.lineWidth=1/zt.k;octx.strokeStyle=TH.hov;octx.stroke();}
    if(sel){octx.beginPath();g(sel);octx.lineWidth=1.4/zt.k;octx.strokeStyle=TH.sel;octx.stroke();}}
  // el zoom repinta de cero: cortar cualquier crossfade en curso para no arrastrar una imagen vieja
  function render(){zr=zt;wrap.style.transform="none";fade.style.transition="none";fade.style.opacity="0";drawBase();drawPick();drawOver();}
  function cssZoom(){const s=zt.k/zr.k;wrap.style.transformOrigin="0 0";wrap.style.transform="translate("+(zt.x-s*zr.x)+"px,"+(zt.y-s*zr.y)+"px) scale("+s+")";}
  function layout(){sizeSheet();W=wrap.clientWidth;H=wrap.clientHeight;fitC(base,W,H);fitC(fade,W,H);fitC(over,W,H);fitC(pick,W,H,true);
    bctx=base.getContext("2d");fctx=fade.getContext("2d");octx=over.getContext("2d");pctx=pick.getContext("2d",{willReadFrequently:true});
    const mob=innerWidth<=820;L=mob?6:12+328+18;R=W-(mob?6:12+328+18);T=mob?6:62+8;B=H-(mob?6:84);proj=d3.geoMercator().fitExtent([[L,T],[R,B]],geo);
    idx.clear();F.forEach((f,i)=>idx.set(i+1,f));medirSitios();render();}

  const zoom=d3.zoom().scaleExtent([1,12]).on("zoom",e=>{zt=e.transform;cssZoom();}).on("end",()=>render());
  d3.select(catchEl).call(zoom);
  document.getElementById("z-in").onclick=()=>d3.select(catchEl).transition().duration(250).call(zoom.scaleBy,1.6);
  document.getElementById("z-out").onclick=()=>d3.select(catchEl).transition().duration(250).call(zoom.scaleBy,1/1.6);
  // el botón ⤢ vuelve a Bolivia, pero NO descarta el municipio señalado (solo resetea la vista)
  document.getElementById("z-rst").onclick=()=>setDept("",true);
  // único punto de entrada para cambiar el foco: sincroniza top bar + mapa + ficha
  function setDept(dp,keepSel){focusDept=dp||null;
    document.getElementById("dept-lab").textContent=dp||"Bolivia";
    document.querySelectorAll("#dept-drop .tbop").forEach(o=>o.classList.toggle("on",(o.dataset.d||"")===(dp||"")));
    zoomToDept(dp);
    if(keepSel&&sel)renderMun(sel.properties.sigep);else renderSummary();}
  function zoomToDept(dp){focusDept=dp||null;drawBase();drawOver();
    if(!dp){d3.select(catchEl).transition().duration(400).call(zoom.transform,d3.zoomIdentity);return;}
    const feats=F.filter(f=>DATA[f.properties.sigep].dpto===dp),b=d3.geoPath(proj).bounds({type:"FeatureCollection",features:feats});
    const bw=b[1][0]-b[0][0],bh=b[1][1]-b[0][1],cx=(b[0][0]+b[1][0])/2,cy=(b[0][1]+b[1][1])/2;
    const k=Math.max(1,Math.min(12,.86*Math.min((R-L)/bw,(B-T)/bh)));
    const t=d3.zoomIdentity.translate((L+R)/2,(T+B)/2).scale(k).translate(-cx,-cy);
    d3.select(catchEl).transition().duration(500).call(zoom.transform,t);}

  const pop=document.getElementById("pop");
  const pixel=e=>{const r=wrap.getBoundingClientRect();return pctx.getImageData(Math.round((e.clientX-r.left)*dpr),Math.round((e.clientY-r.top)*dpr),1,1).data;};
  // picking robusto: muestrea un bloque y devuelve el municipio válido más cercano al toque (tolera bordes antialiaseados y municipios chicos)
  function featAt(e){const r=wrap.getBoundingClientRect(),x=Math.round((e.clientX-r.left)*dpr),y=Math.round((e.clientY-r.top)*dpr);
    const rad=Math.round(7*dpr),x0=Math.max(0,x-rad),y0=Math.max(0,y-rad),x1=Math.min(pick.width-1,x+rad),y1=Math.min(pick.height-1,y+rad);
    const bw=x1-x0+1,bh=y1-y0+1;if(bw<1||bh<1)return null;
    const img=pctx.getImageData(x0,y0,bw,bh).data,cx=x-x0,cy=y-y0;let best=null,bd=1e18;
    for(let j=0;j<bh;j++)for(let i=0;i<bw;i++){const o=(j*bw+i)<<2;if(img[o+3]===0)continue;const f=idx.get((img[o]<<16)+(img[o+1]<<8)+img[o+2]);if(!f)continue;const d=(i-cx)*(i-cx)+(j-cy)*(j-cy);if(d<bd){bd=d;best=f;}}
    return best;}
  catchEl.addEventListener("mousemove",e=>{if(innerWidth<=820){pop.style.opacity=0;return;}const px=pixel(e),f=idx.get((px[0]<<16)+(px[1]<<8)+px[2])||null;
    if(f!==hov){hov=f;drawOver();}
    if(f){const s=f.properties.sigep,d=DATA[s],u=uMode(cur),v=valOf(s,cur);
      pop.querySelector(".pn").textContent=d.nombre;
      pop.querySelector(".pd").textContent=d.dpto+" · "+cur.label;
      pop.querySelector(".pv b").textContent=mudo(cur)?"s/d":fmtM(v,cur);
      pop.querySelector(".pv small").textContent=mudo(cur)?"":u;
      if(mudo(cur))
        pop.querySelector(".pr").innerHTML=`<span>Este indicador sólo existe en 2024</span>`;
      else if(ANIO==="cambio")
        // en el modo cambio la comparación útil no es contra los vecinos sino
        // contra uno mismo: de dónde venía y dónde está
        pop.querySelector(".pr").innerHTML=`<span>2012 <b>${fmtY(v12(s,cur.key),cur)}</b></span>`
          +`<span>2024 <b>${fmtY(v24(s,cur.key),cur)}</b></span>`;
      else{const p=pais(cur,ANIO);
        pop.querySelector(".pr").innerHTML=`<span>Puesto <b>${puesto(s,cur)||"—"}</b>/343</span>`
          +`<span>vs. país <b>${p==null||v==null?"—":sgn(v-p)}</b></span>`;}
      pop.style.opacity=1;pop.style.left=Math.min(e.clientX+16,innerWidth-200)+"px";pop.style.top=Math.min(e.clientY+16,innerHeight-110)+"px";
    }else pop.style.opacity=0;});
  catchEl.addEventListener("mouseleave",()=>{hov=null;drawOver();pop.style.opacity=0;});
  let _tapXY=null;
  catchEl.addEventListener("pointerdown",e=>{_tapXY=[e.clientX,e.clientY];});
  catchEl.addEventListener("pointerup",e=>{if(!_tapXY)return;const mv=Math.hypot(e.clientX-_tapXY[0],e.clientY-_tapXY[1]);_tapXY=null;if(mv>8)return;const f=featAt(e);if(f){sel=f;drawOver();renderMun(f.properties.sigep);}else{sel=null;drawOver();renderSummary();}escribirURL(true);});

  const termoEl=document.querySelector(".termo");
  function termo(){const sc=scale(cur),u=uMode(cur),f=v=>fmtM(v,cur);
    if(!reduceMo()){termoEl.classList.remove("swap");void termoEl.offsetWidth;termoEl.classList.add("swap");}
    const eti=ANIO==="cambio"?"cambio 2012→2024":"censo "+ANIO;
    termoEl.classList.toggle("nodata",mudo(cur));
    document.getElementById("tm-t").innerHTML=cur.label+` <small>${mudo(cur)?eti:u+" · "+eti}</small>`;
    const bar=document.getElementById("tm-bar");bar.querySelectorAll(".tm-mk").forEach(m=>m.remove());
    // el indicador existe pero este censo no lo puede dar: la leyenda lo dice con
    // todas las letras en vez de mostrar una barra que no significa nada
    if(mudo(cur)){
      bar.style.background=`repeating-linear-gradient(135deg,${TH.nd},${TH.nd} 5px,transparent 5px,transparent 10px)`;
      document.getElementById("tm-lo").innerHTML="";document.getElementById("tm-hi").innerHTML="";
      document.getElementById("tm-st").innerHTML=`<b>Sólo 2024.</b> ${cur.w12||""}`;return;}
    // La barra usa la MISMA rampa orientada que el mapa: en un indicador con dir:+1 el
    // degradado corre al revés, si no la leyenda diría lo contrario de lo que se ve.
    bar.style.background=`linear-gradient(to right,${d3.range(0,1.001,.04).map(t=>RAMP(cur)(t)).join(",")})`;
    document.getElementById("tm-lo").innerHTML=`<span class="cap">≤ </span>${f(sc.lo)}`;
    document.getElementById("tm-hi").innerHTML=`<span class="cap">≥ </span>${f(sc.hi)}`;
    // El marcador del centro está en el 50% de la barra porque el dominio de tres
    // puntos manda el pivote justo al medio de la rampa. Vale igual para la
    // secuencial: ahí marca dónde cae el país, o sea de qué tono para arriba un
    // municipio está por encima del promedio nacional.
    const m=document.createElement("div");m.className="tm-mk";m.style.left="50%";bar.appendChild(m);
    // Se nombra el pivote: si no, el lector supone "mediana" y en 17 de los 215 el
    // número recortado no es la mediana ni el país.
    const pr=sc.pivReal==null?"":`${sc.pivTipo} <b>${f(sc.pivReal)}</b>`
      +(Math.abs(sc.pivReal-sc.piv)>1e-9?` <span style="opacity:.75">(escala centrada en ${f(sc.piv)})</span>`:"");
    document.getElementById("tm-st").innerHTML=`n <b>343</b> · mín <b>${f(sc.min)}</b> · ${pr} · máx <b>${f(sc.max)}</b>`;}

  // ════════════════════════════════════════════════════════════════════════
  //  EL REPARTO DE LOS 343, Y LO QUE EL DIBUJO NO PUEDE DECIR
  // ════════════════════════════════════════════════════════════════════════
  // Las dos piezas salen del MISMO dato que acaba de pintarse en el mapa —los
  // mismos valores, el mismo dominio, la misma rampa—, así que no pueden
  // desincronizarse de lo que el lector está mirando.
  const N_BIN=30;
  function reparto(){
    const sc=scale(cur);
    if(sc.vacio)return null;
    const vs=[];for(const s of SIG){const v=valOf(s,cur);if(v!=null&&!isNaN(v))vs.push([s,v]);}
    if(vs.length<8)return null;
    // el histograma usa el MISMO dominio recortado que el mapa: si usara el
    // rango crudo, un municipio extremo estiraría el eje y el 95% de las barras
    // se apelotonaría en un rincón mientras el mapa muestra otra cosa
    const lo=sc.lo,hi=sc.hi,paso=(hi-lo)/N_BIN||1;
    const bins=new Array(N_BIN).fill(0);
    for(const [,v] of vs){
      const j=Math.max(0,Math.min(N_BIN-1,Math.floor((v-lo)/paso)));bins[j]++;}
    return{sc,vs,lo,hi,paso,bins,tope:Math.max(...bins)};}

  function distribucion(){
    const el=document.getElementById("dist");if(!el)return;
    const r=reparto();
    if(!r){el.innerHTML="";return;}
    const {sc,lo,hi,paso,bins,tope}=r;
    const W=100,H=30,BASE=H-6;
    const x=v=>((v-lo)/(hi-lo))*W;
    let s="";
    bins.forEach((n,j)=>{
      const h=n?Math.max(.9,(n/tope)*(BASE-2)):0;
      // cada barra lleva el color que le tocaría a su tramo EN EL MAPA: así el
      // histograma es también la leyenda, y se ve de una qué tono es frecuente
      s+=`<rect x="${(j*W/N_BIN).toFixed(2)}" y="${(BASE-h).toFixed(2)}" width="${(W/N_BIN-.22).toFixed(2)}"`
       +` height="${h.toFixed(2)}" fill="${sc.color(lo+(j+.5)*paso)}"/>`;});
    // referencias: el país siempre; el departamento sólo si hay uno en foco
    const marca=(v,cls,txt)=>v==null||!isFinite(v)?"":
      `<line x1="${x(v).toFixed(2)}" y1="1" x2="${x(v).toFixed(2)}" y2="${BASE}" class="${cls}"/>`
      +`<text x="${Math.min(W-1,Math.max(1,x(v))).toFixed(2)}" y="${H-1}" class="dt-ax"`
      +` text-anchor="${x(v)>W*.7?"end":x(v)<W*.3?"start":"middle"}">${txt}</text>`;
    const vPais=pais(cur,ANIO);
    s+=marca(clamp(vPais,lo,hi),"dt-pais","país "+fmtM(vPais,cur));
    if(focusDept){const vd=agg(byDpto[focusDept],cur);
      s+=marca(clamp(vd,lo,hi),"dt-dpto",focusDept);}
    // el municipio señalado va ARRIBA de todo y en ámbar, el mismo color con
    // que el mapa lo resalta: es el mismo objeto en dos dibujos
    if(sel){const v=valOf(sel.properties.sigep,cur);
      if(v!=null&&isFinite(v)){const px=x(Math.min(hi,Math.max(lo,v)));
        s+=`<polygon class="dt-sel" points="${px-1.6},0 ${px+1.6},0 ${px},2.6"/>`
          +`<line x1="${px}" y1="0" x2="${px}" y2="${BASE}" class="dt-sell"/>`;}}
    // ⚠️ SE DECLARA QUE EL EJE ES EL DEL MAPA, no el rango crudo. El dominio va
    //    recortado (p2–p98), así que los extremos entran clampeados en la primera
    //    y en la última barra — y la lectura de abajo sí nombra el máximo real.
    //    Sin esta línea, «encabeza con 93,6%» debajo de un eje que termina en
    //    70,8% parece una contradicción en vez de dos cosas distintas.
    el.innerHTML=`<div class="dt-t">Cómo se reparten los 343<span>eje del mapa · ${
        fmtM(sc.lo,cur)} a ${fmtM(sc.hi,cur)}</span></div>`
      +`<svg class="dt" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${s}</svg>`;}

  const clamp=(v,a,b)=>v==null||!isFinite(v)?null:Math.min(b,Math.max(a,v));

  // ── LA LECTURA ────────────────────────────────────────────────────────────
  // «No trates de usar todo el espacio, puedes añadir abajo texto para que
  // rellene» (Carlos, para el tablero metropolitano). Lo que sobra se llena con
  // lo que el dibujo NO puede decir: quién encabeza, quién cierra, cuánto hay
  // entre las puntas y cuántos quedan por encima del país.
  function lectura(){
    const el=document.getElementById("lee");if(!el)return;
    const r=reparto();
    if(!r||mudo(cur)){el.innerHTML="";return;}
    const {vs}=r,u=uMode(cur);
    const orden=vs.slice().sort((a,b)=>d3.descending(a[1],b[1]));
    const alto=orden[0],bajo=orden[orden.length-1];
    const nom=s=>DATA[s].nombre;
    const li=[];
    // ⚠️ La DIFERENCIA entre dos porcentajes se mide en PUNTOS. Decir «3,2%
    //    entre las dos puntas» sugiere una razón —que uno es 3,2% del otro—
    //    cuando lo que hay es una distancia de 3,2 puntos.
    const ug=(ANIO!=="cambio"&&cur.unit==="%"&&!esConteo(cur))?"pp":u;
    li.push(`<b>${nom(alto[0])}</b> encabeza con ${fmtM(alto[1],cur)} y <b>${nom(bajo[0])}</b>`
      +` cierra con ${fmtM(bajo[1],cur)}: ${fmt(Math.abs(alto[1]-bajo[1]),"").trim()}`
      +`${ug==="%"?"%":" "+ug} entre las dos puntas.`);
    const p=pais(cur,ANIO);
    if(p!=null&&isFinite(p)){
      const arriba=vs.filter(x=>x[1]>p).length;
      li.push(`<b>${arriba}</b> de ${vs.length} ${arriba===1?"queda":"quedan"} por encima`
        +` del país (${fmtM(p,cur)}).`);}
    if(ANIO==="cambio"){
      const suben=vs.filter(x=>x[1]>0).length,bajan=vs.filter(x=>x[1]<0).length;
      li.push(suben===vs.length?"Los 343 suben entre los dos censos."
        :bajan===vs.length?"Los 343 bajan entre los dos censos."
        :`<b>${suben}</b> ${suben===1?"sube":"suben"} y <b>${bajan}</b> ${bajan===1?"baja":"bajan"}`
         +` entre los dos censos.`);
      li.push(`<span class="lee-adv">El censo da dos puntos y no dice nada de lo que pasó`
        +` en el medio: esto es el cambio entre 2012 y 2024, no una trayectoria.</span>`);}
    // si hay un municipio señalado, la última frase habla de él
    if(sel){const s=sel.properties.sigep,v=valOf(s,cur);
      if(v!=null&&isFinite(v)){
        const pu=puesto(s,cur),mitad=pu<=Math.round(vs.length/2);
        li.push(`<b>${DATA[s].nombre}</b> está en el puesto <b>${pu}</b> de ${vs.length}`
          +`${p!=null&&isFinite(p)?`, ${v>p?"por encima":v<p?"por debajo":"justo en"} del país`:""}`
          +` — en la ${mitad?"mitad de arriba":"mitad de abajo"} del reparto.`);}}
    el.innerHTML=`<div class="lee">${li.map(t=>`<p>${t}</p>`).join("")}</div>`;}

  // ── COMPARAR DOS INDICADORES ──────────────────────────────────────────────
  // ★ POR QUÉ UNA DISPERSIÓN Y NO UN MAPA BIVARIADO. El bivariado sería lo
  //   vistoso y obliga al lector a decodificar cada tono contra una leyenda de
  //   3×3 para leer una relación que un gráfico contesta de un golpe. Además el
  //   mapa ya está ocupado mostrando el indicador principal, y repintarlo de
  //   otra cosa rompería su vínculo con la leyenda, las tarjetas y el histograma.
  // ★ SE INFORMA SPEARMAN, NO PEARSON. Varios indicadores tienen a Santa Cruz de
  //   la Sierra, El Alto o La Paz como valores extremos por puro tamaño, y una
  //   correlación lineal la mueven esos pocos puntos. Spearman compara ÓRDENES,
  //   así que contesta la pregunta que de verdad se hace: «¿los que están arriba
  //   en uno están arriba en el otro?».
  // ★ Y NO DICE «CAUSA». El texto describe cómo se acompañan, nada más.
  let indB=null;
  function rangos(v){
    // rangos con empates PROMEDIADOS, que es lo que pide Spearman: repartir el
    // 3.º y el 4.º al azar entre dos municipios con el mismo valor sería
    // inventar un orden que el dato no tiene
    const idx=v.map((x,i)=>[x,i]).sort((a,b)=>a[0]-b[0]),r=new Array(v.length);
    let i=0;
    while(i<idx.length){let j=i;
      while(j+1<idx.length&&idx[j+1][0]===idx[i][0])j++;
      const med=(i+j)/2+1;
      for(let k=i;k<=j;k++)r[idx[k][1]]=med;
      i=j+1;}
    return r;}
  function spearman(xs,ys){
    if(xs.length<8)return null;
    const rx=rangos(xs),ry=rangos(ys),n=xs.length;
    const mx=d3.mean(rx),my=d3.mean(ry);
    let num=0,dx=0,dy=0;
    for(let i=0;i<n;i++){const a=rx[i]-mx,b=ry[i]-my;num+=a*b;dx+=a*a;dy+=b*b;}
    return dx&&dy?num/Math.sqrt(dx*dy):null;}
  const fmtNum=v=>v==null||isNaN(v)?"—":(v<0?"−":"")+Math.abs(v).toFixed(2).replace(".",",");

  function montarComparar(){
    const s=document.getElementById("cmp-b");if(!s)return;
    // se ofrecen TODOS los indicadores, no sólo los de la categoría en pantalla:
    // las relaciones que valen la pena suelen cruzar categorías (agua con NBI)
    s.innerHTML=`<option value="">Comparar con…</option>`+GRUPOS.map(g=>
      `<optgroup label="${g.label}">`+g.indicadores.filter(i=>i.key!==cur.key)
        .map(i=>`<option value="${i.key}"${indB&&indB.key===i.key?" selected":""}>${i.label}</option>`).join("")
      +`</optgroup>`).join("");
    s.onchange=()=>{
      indB=s.value?GRUPOS.flatMap(g=>g.indicadores).find(i=>i.key===s.value)||null:null;
      dispersion();};}

  function dispersion(){
    const el=document.getElementById("cmp");if(!el)return;
    if(!indB||indB.key===cur.key||mudo(cur)||mudo(indB)){el.innerHTML="";return;}
    const scA=scale(cur),pts=[];
    for(const s of SIG){const a=valOf(s,cur),b=valOf(s,indB);
      if(a==null||b==null||isNaN(a)||isNaN(b))continue;pts.push([s,a,b]);}
    if(pts.length<8){
      el.innerHTML=`<div class="dt-t">Comparar<span>sin pares suficientes</span></div>`;return;}
    const xa=d3.extent(pts,p=>p[1]),ya=d3.extent(pts,p=>p[2]);
    const W=100,H=72,LX=3,RX=W-2,TY=3,BY=H-9;
    const px=v=>LX+((v-xa[0])/((xa[1]-xa[0])||1))*(RX-LX);
    // el eje de las Y va al revés que el lienzo: arriba es MÁS
    const py=v=>BY-((v-ya[0])/((ya[1]-ya[0])||1))*(BY-TY);
    let g="";
    for(const [s,a,b] of pts){
      if(sel&&sel.properties.sigep===s)continue;   // el señalado va al final, encima
      g+=`<circle cx="${px(a).toFixed(2)}" cy="${py(b).toFixed(2)}" r="1.15"`
        +` fill="${scA.color(a)}" fill-opacity=".72"/>`;}
    if(sel){const s=sel.properties.sigep,a=valOf(s,cur),b=valOf(s,indB);
      if(a!=null&&b!=null&&!isNaN(a)&&!isNaN(b))
        g+=`<circle cx="${px(a).toFixed(2)}" cy="${py(b).toFixed(2)}" r="2.1" class="cmp-sel"/>`;}
    const rho=spearman(pts.map(p=>p[1]),pts.map(p=>p[2])),f=Math.abs(rho||0);
    const fuerza=f>=.7?"muy de la mano":f>=.5?"bastante de la mano"
      :f>=.3?"algo de la mano":"casi sin relación";
    const sentido=rho>0?"suben juntos":"cuando uno sube, el otro baja";
    el.innerHTML=`<div class="dt-t">${cur.label} <i>contra</i> ${indB.label}`
      +`<span>${pts.length} municipios</span></div>`
      +`<svg class="cmp" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMin meet">${g}`
      +`<text x="${LX}" y="${H-3}" class="cmp-ax">${fmtY(xa[0],cur)}</text>`
      +`<text x="${RX}" y="${H-3}" class="cmp-ax" text-anchor="end">${fmtY(xa[1],cur)} →</text>`
      +`</svg>`
      +`<div class="lee"><p>Cada punto es un municipio: al costado, <b>${cur.label}</b>;`
      +` a lo alto, <b>${indB.label}</b>.</p>`
      +`<p>Van <b>${fuerza}</b>${rho==null?"":" — "+sentido}.`
      +` <span class="lee-adv">ρ de Spearman ${fmtNum(rho)}, calculado sobre el ORDEN de los`
      +` ${pts.length} municipios y no sobre los valores, para que no lo muevan unas pocas`
      +` ciudades grandes. Dice cómo se acompañan, no que uno cause al otro.</span></p></div>`;}

  const repintarFicha=()=>{montarComparar();dispersion();distribucion();lectura();};

  // cambiar de indicador NO reconstruye la ficha (evita el parpadeo y conserva el scroll):
  // solo mueve el resalte, repinta el mapa con crossfade y actualiza el bloque peek
  function select(ind){cur=ind;
    document.querySelectorAll(".ind").forEach(c=>c.classList.toggle("on",c.dataset.k===ind.key));
    document.querySelectorAll("#kgrid .kpi").forEach(el=>el.classList.toggle("on",el.dataset.k===ind.key));
    fadeSwap(drawBase);drawOver();termo();renderLamina();repintarFicha();
    if(sel)renderPeek(sel.properties.sigep);else if(focusDept)renderPeekDept(focusDept);else renderPeekNat();}

  // ── el enlace a la lámina de la Galería ──
  // ⚠️ EL RÓTULO CAMBIA CON EL AÑO, y no es un detalle. La lámina de la Galería
  //    es SIEMPRE del censo 2024. Ofrecer «descargar este mapa» mientras el
  //    lector mira el mapa del cambio 2012→2024, y entregarle otro, sería
  //    mentir. Se sigue ofreciendo —el mapa de 2024 le sirve igual— pero
  //    diciendo cuál es.
  const GAL="https://centro-de-estudios-populi.github.io/galeria-populi/graficas/";
  const slug=t=>t.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
    .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  function renderLamina(){
    const el=document.getElementById("lamina");if(!el)return;
    if(!cur.lam){el.innerHTML="";return;}
    const es24=ANIO==="2024";
    el.innerHTML=`<a class="lam-link" href="${GAL}${cur.lam}.png"`
      +` download="${slug(cur.label)}-bolivia-censo-2024.png"`
      +` title="Lámina de «${cur.label}» · los 343 municipios, censo 2024">`
      +`<span class="lam-i" aria-hidden="true">▤</span>`
      +`<span class="lam-tx"><b>${es24?"Descargar este mapa":"Descargar el mapa de 2024"}</b>`
      +`<em>Lámina PNG lista para imprimir</em></span></a>`;}

  // ★ AGREGACIÓN POR EL UNIVERSO DE CADA INDICADOR, no por población.
  //   Antes esta función ponderaba TODO por `pob_total`, y como cada indicador
  //   tiene su propio denominador, cualquier cifra departamental o nacional
  //   salía mal aunque las municipales fueran exactas:
  //     agua por cañería  INE 71,19%  ·  por población 72,27%  ·  por viviendas 71,19% ✓
  //     emigra a Argentina real 31,11% ·  por población 26,97% ·  por emigrantes 31,11% ✓
  //   El catálogo declara el modo en `ind.agg` y el denominador en `ind.den`.
  //   ⚠️ Y EL UNIVERSO ES EL DEL CENSO QUE SE MIRA: agregar 2012 con las
  //   viviendas y la población de 2024 sería el mismo error corrido un censo.
  //   Por eso `denominadores_2012.json` viaja aparte, con EL MISMO `orden`.
  const peso=(r,ind,DN)=>{const D=DN[r.sigep||r.cod_ine];
    if(!D||!ind.den)return r.pob_total;
    const j=DEN_ORDEN.indexOf(ind.den);return j<0?r.pob_total:D[j];};
  function aggRaw(rows,ind,DN){
    // conteos: se SUMAN. ⚠️ Esto se decidía mirando la UNIDAD (hab/viv/pers) y
    // `pers` es AMBIGUA: vale "personas" (conteo) y "personas por hogar" (razón).
    // Por eso la pantalla de entrada mostraba "Personas por hogar: 1.049,2", que
    // es la suma de los 343 promedios municipales. Ahora lo declara el catálogo
    // (`agregacion.py` → agg:"suma") y acá no se adivina nada.
    if(ind.agg==="suma")
      return d3.sum(rows.map(r=>r[ind.key]).filter(v=>v!=null));
    // no agregable desde lo municipal (la mediana nacional no es función de las
    // medianas municipales): mejor no mostrar nada que mostrar algo falso
    if(ind.agg==="no")return null;
    // una brecha es una RESTA de dos porcentajes: se rearma de sus componentes
    if(ind.agg==="brecha"&&ind.comp){
      const p=k=>{let n=0,d=0;rows.forEach(r=>{const v=r[k],w=peso(r,ind,DN);
        if(v!=null&&w!=null){n+=v*w;d+=w;}});return d?n/d:null;};
      const a=p(ind.comp[0]),b=p(ind.comp[1]);
      return (a==null||b==null)?null:a-b;}
    // el resto: promedio ponderado por SU denominador
    let n=0,d=0;rows.forEach(r=>{const v=r[ind.key],w=peso(r,ind,DN);
      if(v!=null&&w!=null){n+=v*w;d+=w;}});return d?n/d:null;}

  // el agregado de un conjunto de municipios en UN censo concreto
  const aggFor=(sigeps,ind,anio)=>anio==="2012"
    ? (ind.s12&&hay12?aggRaw(sigeps.map(s=>D12[s]).filter(Boolean),ind,DEN12):null)
    : aggRaw(sigeps.map(s=>DATA[s]).filter(Boolean),ind,DEN);
  // …y en el modo que está en pantalla
  function agg(sigeps,ind){
    if(ANIO==="2024")return aggFor(sigeps,ind,"2024");
    if(!ind.s12)return null;
    if(ANIO==="2012")return aggFor(sigeps,ind,"2012");
    // ★ EL CAMBIO DEL PAÍS NO ES EL PROMEDIO DE LOS CAMBIOS MUNICIPALES: es la
    //   diferencia entre los dos agregados, cada uno calculado con su propio
    //   universo. Promediar los 343 deltas le daría el mismo peso a Uru Chipaya
    //   que a Santa Cruz de la Sierra.
    const a=aggFor(sigeps,ind,"2012"),b=aggFor(sigeps,ind,"2024");
    if(a==null||b==null)return null;
    return esConteo(ind)?(a?100*(b-a)/a:null):b-a;}
  // el valor del país, que es contra lo que se comparan municipio y departamento
  const paisC={};
  const pais=(ind,anio)=>{const k=ind.key+"|"+anio;
    return k in paisC?paisC[k]:(paisC[k]=aggFor(SIG,ind,anio));};
  // puesto entre los 343 EN LO QUE SE ESTÁ MIRANDO: en modo cambio ordena por
  // cuánto cambió, no por cuánto tiene
  function puesto(s,ind){const v=valOf(s,ind);if(v==null)return null;
    return SIG.map(x=>valOf(x,ind)).filter(x=>x!=null).sort(d3.descending).indexOf(v)+1;}

  const cls=x=>x>=0?"up":"dn";
  const pctTxt=(v,d)=>(v*100).toFixed(d==null?1:d).replace(".",",")+"%";
  // ⚠️ El separador de miles también se decidía por la UNIDAD (`u==="hab"`), así
  //    que "Viviendas" se imprimía **453158,0 viv**: sin puntos y con un decimal
  //    que no existe. Tercera vez que la unidad hace de declaración. Un conteo lo
  //    dice `agg:"suma"`, y un conteo se escribe redondo y con puntos.
  const fmtI=(v,ind)=>v==null||isNaN(v)?"s/d"
    :d3.format(",")(Math.round(v)).replace(/,/g,".")+(ind.unit==="hab"?"":" "+ind.unit);
  // valor en la unidad propia del indicador, sin importar el modo (lo usan el
  // tooltip y el peek para mostrar "2012 X → 2024 Y" dentro del modo cambio)
  const fmtY=(v,ind)=>esConteo(ind)?fmtI(v,ind):fmt(v,ind.unit);
  const fmtM=(v,ind)=>ANIO==="cambio"?fmtD(v,uMode(ind)):fmtY(v,ind);
  // chip de comparación. Para un CONTEO se informa qué porción representa; para
  // el resto, la diferencia. ⚠️ En modo cambio siempre es diferencia: el valor ya
  // es un cambio y "el 27% del cambio del país" no querría decir nada.
  const chip=(v,n,ind,que,dec)=>
    v==null||n==null||isNaN(v)||isNaN(n)?`vs. ${que} <b>—</b>`
    :(esConteo(ind)&&ANIO!=="cambio"?`del ${que} <b>${pctTxt(v/n,dec)}</b>`
    :`vs. ${que} <b class="${cls(v-n)}">${sgn(v-n)}</b>`);
  const kpiHTML=(ind,i,v,c1,c2)=>
    `<div class="kpi ${ind.key===cur.key?'on':''}${mudo(ind)?' sin12':''}" data-k="${ind.key}" style="--d:${Math.min(i,14)*14}ms">`
    +`<div class="k-l">${ind.label}</div><div class="k-v">${mudo(ind)?"s/d":fmtM(v,ind)}</div>`
    +`<div class="k-c">${mudo(ind)?"<span>sólo 2024</span>":`<span>${c1}</span><span>${c2}</span>`}</div></div>`;
  // puesto del departamento entre los 9 (1 = valor más alto), mismo criterio que el ranking municipal
  function deptRank(dp,ind){const arr=DEPTOS.map(d=>[d,agg(byDpto[d],ind)]).filter(x=>x[1]!=null).sort((a,b)=>d3.descending(a[1],b[1]));
    return arr.findIndex(x=>x[0]===dp)+1;}
  // la ficha por defecto sigue al foco del top bar: el departamento si hay zoom a uno, el país si no
  const renderSummary=()=>focusDept?renderDept(focusDept):renderNational();
  function wireKpi(){document.querySelectorAll("#kgrid .kpi").forEach(el=>el.onclick=()=>{select(INDS.find(i=>i.key===el.dataset.k));escribirURL(true);});}
  // ── ficha = bottom-sheet deslizable en móvil (peek / full / hidden) ──
  const sheet=document.getElementById("panel-det"),grip=document.getElementById("sheet-grip");
  const isMob=()=>innerWidth<=820;
  let sheetState="hidden";
  const peekPx=()=>parseInt(getComputedStyle(document.documentElement).getPropertyValue("--peek"))||138;
  const detBody=sheet.querySelector(".p-body");
  // el sheet mide EXACTAMENTE lo que se ve en el detent "full" (translateY=0): así nada queda bajo la pantalla
  function sizeSheet(){if(!isMob()){sheet.style.height="";return;}sheet.style.height=Math.round(innerHeight*.74)+"px";}
  function detentY(s){const H=sheet.clientHeight;if(s==="full")return 0;if(s==="peek")return Math.max(0,H-peekPx());return H;}
  function checkEnd(){sheet.classList.toggle("at-end",detBody.scrollTop+detBody.clientHeight>=detBody.scrollHeight-4);}
  detBody.addEventListener("scroll",checkEnd,{passive:true});
  const resetScroll=()=>{detBody.scrollTop=0;requestAnimationFrame(checkEnd);};
  function setSheet(s){
    if(!isMob()){sheet.style.transform="";document.body.classList.remove("sheet-open");return;}
    sheetState=s;sheet.style.transform="translateY("+detentY(s)+"px)";
    document.body.classList.toggle("sheet-open",s!=="hidden");}
  function setDetailVisible(v){if(!isMob())return;if(v){if(sheetState==="hidden")setSheet("peek");}else setSheet("hidden");}
  const curY=()=>{const m=/translateY\(([-\d.]+)px\)/.exec(sheet.style.transform);return m?parseFloat(m[1]):detentY("hidden");};
  let dg=false,dY0=0,dT0=0,dMv=0;
  grip.addEventListener("pointerdown",e=>{if(!isMob())return;dg=true;dY0=e.clientY;dT0=curY();dMv=0;sheet.classList.add("dragging");try{grip.setPointerCapture(e.pointerId);}catch(_){}});
  grip.addEventListener("pointermove",e=>{if(!dg)return;dMv=Math.max(dMv,Math.abs(e.clientY-dY0));const y=Math.max(detentY("full"),Math.min(sheet.clientHeight,dT0+(e.clientY-dY0)));sheet.style.transform="translateY("+y+"px)";});
  function endDrag(){if(!dg)return;dg=false;sheet.classList.remove("dragging");
    if(dMv<6){setSheet(sheetState==="full"?"peek":"full");return;}
    const y=curY(),cand=[["full",detentY("full")],["peek",detentY("peek")],["hidden",sheet.clientHeight]];
    let best=cand[0],bd=1e9;cand.forEach(c=>{const d=Math.abs(c[1]-y);if(d<bd){bd=d;best=c;}});
    // arrastrar hasta abajo cierra la ficha: se repuebla con el resumen vigente y se oculta en el mismo tick
    if(best[0]==="hidden"){renderSummary();setSheet("hidden");}else setSheet(best[0]);}
  grip.addEventListener("pointerup",endDrag);grip.addEventListener("pointercancel",endDrag);
  function renderNational(){setDetailVisible(false);sel=null;drawOver();
    document.getElementById("panel-det").style.display="flex";
    document.getElementById("d-mun").textContent="Bolivia";
    document.getElementById("d-sub").innerHTML=(ANIO==="cambio"?"Cambio 2012→2024":"Censo "+ANIO)+" · 343 municipios";
    document.getElementById("kgrid").innerHTML=INDS.map((ind,i)=>{const sc=scale(ind);
      // en modo cambio el mín y el máx son el municipio que más cayó y el que
      // más subió, que es la lectura que corresponde
      return kpiHTML(ind,i,agg(SIG,ind),`mín <b>${fmtM(sc.min,ind)}</b>`,`máx <b>${fmtM(sc.max,ind)}</b>`);}).join("");
    renderPeekNat();wireKpi();repintarFicha();resetScroll();}
  // resumen del DEPARTAMENTO como un todo: sale al elegirlo en el top bar mientras no haya municipio señalado.
  // Agregación igual que el nacional (fn agg): conteos = suma, tasas = promedio ponderado por población.
  function renderDept(dp){const rows=byDpto[dp];if(!rows)return;sel=null;drawOver();setDetailVisible(true);
    document.getElementById("panel-det").style.display="flex";
    document.getElementById("d-mun").textContent=dp;
    document.getElementById("d-sub").innerHTML=`${ANIO==="cambio"?"Cambio 2012→2024":"Censo "+ANIO} · ${rows.length} municipios · <a class="back" id="back-nac">‹ resumen nacional</a>`;
    document.getElementById("back-nac").onclick=()=>{setDept("");escribirURL(true);};
    document.getElementById("kgrid").innerHTML=INDS.map((ind,i)=>{const vv=agg(rows,ind),nv=agg(SIG,ind);
      const r=deptRank(dp,ind);
      return kpiHTML(ind,i,vv,chip(vv,nv,ind,"país"),
                     r?`puesto <b>${r}/${DEPTOS.length}</b>`:"puesto <b>—</b>");}).join("");
    renderPeekDept(dp);wireKpi();repintarFicha();resetScroll();}
  function renderMun(sig){const r=DATA[sig];if(!r)return;setDetailVisible(true);
    document.getElementById("panel-det").style.display="flex";
    document.getElementById("d-mun").textContent=r.nombre;
    const volver=focusDept?"‹ resumen departamental":"‹ resumen nacional";
    document.getElementById("d-sub").innerHTML=r.dpto+' · <a class="back" id="back-nac">'+volver+'</a>';
    document.getElementById("back-nac").onclick=()=>{sel=null;drawOver();renderSummary();escribirURL(true);};
    document.getElementById("kgrid").innerHTML=INDS.map((ind,i)=>{
      const vv=valOf(sig,ind),dv=agg(byDpto[r.dpto],ind),nv=agg(SIG,ind);
      return kpiHTML(ind,i,vv,chip(vv,dv,ind,"depto"),chip(vv,nv,ind,"país",2));}).join("");
    renderPeek(sig);wireKpi();repintarFicha();resetScroll();}
  // bloque "peek": lo único de la ficha que depende del indicador en pantalla
  const pkHTML=(v,der)=>`<span class="pk-chip" style="background:${scale(cur).color(v)}"></span>`
    // el universo va acá porque el asomo es lo ÚNICO que se ve en móvil con la
    // ficha abajo, y la tarjeta del teléfono no puede mostrarlo (ver el CSS)
    +`<span class="pk-lab">${ANIO==="cambio"?"Cambio en pantalla":"Indicador en pantalla"}<b>${cur.label}</b>`
    +`${cur.universo?`<em class="pk-uni">${cur.universo}</em>`:""}</span>`
    +`<span class="pk-val">${mudo(cur)?"s/d":fmtM(v,cur)}${mudo(cur)?"":`<small>${uMode(cur)}</small>`}</span>`
    +`<span class="pk-rk">${der}</span>`;
  function renderPeek(sig){const r=DATA[sig];if(!r)return;const v=valOf(sig,cur);
    const der=mudo(cur)?"sólo<br>2024"
      // en modo cambio lo que importa no es el puesto sino de dónde venía
      :ANIO==="cambio"?`2012 <b>${fmtY(v12(sig,cur.key),cur)}</b><br>2024 <b>${fmtY(v24(sig,cur.key),cur)}</b>`
      :(()=>{const p=pais(cur,ANIO);
        return `Puesto <b>${puesto(sig,cur)||"—"}</b>/343<br>vs. país <b>${p==null||v==null?"—":sgn(v-p)}</b>`;})();
    document.getElementById("pk").innerHTML=pkHTML(v,der);}
  // peek nacional: sin puesto ni comparación (no se compara consigo mismo), rango de los 343
  function renderPeekNat(){const vv=agg(SIG,cur),psc=scale(cur);
    document.getElementById("pk").innerHTML=pkHTML(vv,mudo(cur)?"sólo<br>2024"
      :`mín <b>${fmtM(psc.min,cur)}</b><br>máx <b>${fmtM(psc.max,cur)}</b>`);}
  // ídem para el resumen departamental (el valor es el agregado, no el de un municipio)
  function renderPeekDept(dp){const rows=byDpto[dp];if(!rows)return;
    const vv=agg(rows,cur),nv=agg(SIG,cur),r=deptRank(dp,cur);
    document.getElementById("pk").innerHTML=pkHTML(vv,mudo(cur)?"sólo<br>2024"
      :`Puesto <b>${r||"—"}</b>/${DEPTOS.length}<br>${chip(vv,nv,cur,"país")}`);}

  // ════════════════════════════════════════════════════════════════════════
  //  EL ATLAS SE PUEDE COMPARTIR, BUSCAR Y RECORRER SIN EL RATÓN
  // ════════════════════════════════════════════════════════════════════════

  // ── 1 · EL ESTADO VIVE EN LA URL ────────────────────────────────────────
  // Hasta acá no se podía mandarle a nadie «mirá este mapa»: la dirección era
  // siempre la misma, el botón atrás no deshacía nada y recargar perdía todo.
  //
  // ⚠️ NO SE GUARDA EL ENCUADRE DEL MAPA, a diferencia del tablero
  //    metropolitano. Allá el zoom es geográfico (centro y nivel), que
  //    significa lo mismo en cualquier pantalla. Acá es una transformación de
  //    d3 en píxeles del lienzo: la de una pantalla de 1600 px aplicada en un
  //    teléfono de 390 px cae en otro lado del país. Lo que sí viaja es el
  //    DEPARTAMENTO en foco, que es el encuadre con significado y se reconstruye
  //    solo a cualquier tamaño.
  //
  // ⚠️ EN LA URL VA EL CÓDIGO INE, no el `sigep` interno. Adentro el municipio
  //    se identifica por sigep («1701») porque así viene la geometría, pero una
  //    dirección que alguien pega en un informe tiene que llevar el código
  //    oficial («070101»), que cualquiera puede cruzar contra otra fuente.
  let _urlQuieta=false,_listo=false;
  const porIne={};for(const s in DATA)porIne[DATA[s].cod_ine]=s;

  function estadoActual(){const e={};
    if(cur)e.i=cur.key;
    if(ANIO!=="2024")e.a=ANIO;
    if(focusDept)e.d=focusDept;
    if(sel)e.m=DATA[sel.properties.sigep].cod_ine;
    return e;}
  // Dos formas de escribir, y la diferencia importa: `pushState` para lo que el
  // lector DECIDIÓ —indicador, año, municipio, departamento—, que es lo que el
  // botón atrás tiene que deshacer; `replaceState` para el estado inicial, que
  // nadie eligió y no merece una entrada de historial.
  function escribirURL(empujar){
    if(_urlQuieta||!_listo)return;
    const e=estadoActual();
    const q=Object.keys(e).map(k=>k+"="+encodeURIComponent(e[k])).join("&");
    const url=location.pathname+(q?"#"+q:"");
    if(url===location.pathname+location.hash)return;
    try{history[empujar?"pushState":"replaceState"](e,"",url);}catch(_){}}
  function leerURL(){const h=location.hash.replace(/^#/,"");if(!h)return null;
    const e={};h.split("&").forEach(p=>{const i=p.indexOf("=");
      if(i>0)e[p.slice(0,i)]=decodeURIComponent(p.slice(i+1));});
    return Object.keys(e).length?e:null;}
  // ★ RECARGAR EMPIEZA LIMPIO. El hash sobrevive al F5, así que volver a la
  //   pestaña devolvía el municipio de la visita anterior. Eso está bien para un
  //   enlace que alguien te manda y mal para abrir el Atlas: la vista por
  //   defecto es el país. El navegador sabe cómo se llegó y lo dice.
  const esRecarga=()=>{try{const n=performance.getEntriesByType("navigation")[0];
    return !!n&&n.type==="reload";}catch(_){return false;}};

  function aplicarEstado(e){
    _urlQuieta=true;
    try{
      // ⚠️ EL ORDEN IMPORTA. `setAnio` re-monta la lista de indicadores, así que
      //    el año se fija por asignación directa ANTES de montar nada y el
      //    conmutador se sincroniza a mano después. (En el metropolitano esto
      //    costó una ronda: reventaba adentro y la excepción se llevaba puesta
      //    la restauración entera, así que un enlace compartido abría la vista
      //    por defecto y parecía que la URL no guardaba nada.)
      if(e.a&&["2012","cambio"].includes(e.a)){ANIO=e.a;pedir2012().catch(()=>{});}
      const g=e.i&&GRUPOS.find(x=>x.indicadores.some(y=>y.key===e.i));
      if(g)setCategory(g.key);
      if(seg)seg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.a===ANIO));
      const ind=e.i&&INDS.find(x=>x.key===e.i);
      if(ind)select(ind);
      if(e.d&&byDpto[e.d])setDept(e.d);
      // se acepta el código INE y, por las dudas, también el sigep: un enlace
      // guardado antes de este cambio no tiene por qué romperse
      const s=e.m&&(porIne[e.m]||(DATA[e.m]?e.m:null));
      if(s){const f=F.find(x=>x.properties.sigep===s);
        if(f){sel=f;drawOver();renderMun(s);}}
      else renderSummary();
    }catch(err){console.warn("no se pudo restaurar el estado",err);}
    finally{_urlQuieta=false;}
    // ⛔ EL ENLACE A 2012 ABRÍA TODO EN «s/d» (cazado con una captura del enlace
    //    profundo). El año se fija por asignación directa —hace falta, ver
    //    arriba— pero eso SALTEA la espera que sí hace `setAnio`: el archivo de
    //    2012 llega en diferido y la página se pintaba antes, con los 343
    //    municipios sin cifra, la leyenda en «mín s/d» y los mini-mapas grises.
    //    El mapa igual salía pintado, así que no parecía roto: parecía que el
    //    censo de 2012 no tenía datos. Se repinta cuando el archivo llega.
    if(ANIO!=="2024"&&!hay12){
      seg.classList.add("cargando");
      pedir2012().then(()=>{seg.classList.remove("cargando");
        buildCards();updateHints();fadeSwap(drawBase);drawOver();termo();renderLamina();
        sel?renderMun(sel.properties.sigep):renderSummary();})
        .catch(()=>{seg.classList.remove("cargando");});}}

  addEventListener("popstate",()=>{const e=leerURL();
    if(e)aplicarEstado(e);else{sel=null;setDept("");}});

  // ── 2 · BUSCADOR ────────────────────────────────────────────────────────
  // Mira las 20 categorías a la vez y busca en el título, la definición Y el
  // universo: desde que las tarjetas dicen qué se mide, «beber» encuentra el
  // indicador de agua segura.
  const _norm=t=>(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  function buscarIndicadores(q){
    const n=_norm(q).trim();
    if(n.length<2)return[];
    const term=n.split(/\s+/),res=[];
    GRUPOS.forEach(g=>g.indicadores.forEach(i=>{
      const heno=_norm(i.label+" "+(i.desc||"")+" "+(i.universo||"")+" "+g.label);
      if(!term.every(t=>heno.includes(t)))return;
      // el que calza en el TÍTULO va antes que el que calza sólo en la
      // definición: si escribiste «agua» querés los indicadores de agua, no
      // todos los que la mencionan de paso
      res.push({i,g,peso:_norm(i.label).includes(n)?0:1});}));
    return res.sort((a,b)=>a.peso-b.peso).slice(0,40);}

  function irA(key,gkey){
    const g=GRUPOS.find(x=>x.key===gkey);
    if(g&&g.key!==curCat.key)setCategory(g.key);
    const ind=INDS.find(x=>x.key===key);
    if(ind){select(ind);
      const el=document.querySelector(`.ind[data-k="${key}"]`);
      if(el)el.scrollIntoView({block:"nearest"});
      escribirURL(true);}}

  (function montarBuscador(){
    const inp=document.getElementById("busca"),caja=document.getElementById("busca-res");
    if(!inp||!caja)return;
    const cerrar=()=>{caja.innerHTML="";caja.hidden=true;};
    inp.addEventListener("input",()=>{
      const r=buscarIndicadores(inp.value);
      if(!r.length){
        if(_norm(inp.value).trim().length>=2){
          caja.innerHTML=`<div class="bs-nada">Nada con «${inp.value}»</div>`;caja.hidden=false;
        }else cerrar();
        return;}
      caja.innerHTML=r.map(({i,g})=>`<button class="bs-op${mudo(i)?" sin12":""}" data-k="${i.key}" data-g="${g.key}">`
        +`<span class="bs-l">${i.label}</span>`
        // el universo va en la línea de abajo junto a la categoría: es lo que
        // desempata entre dos indicadores que se llaman casi igual
        +`<span class="bs-g">${g.label}${i.universo?" · "+i.universo:""}${mudo(i)?" · sólo 2024":""}</span></button>`).join("");
      caja.hidden=false;
      caja.querySelectorAll(".bs-op").forEach(b=>b.onclick=()=>{
        irA(b.dataset.k,b.dataset.g);inp.value="";cerrar();inp.blur();});});
    inp.addEventListener("keydown",ev=>{
      if(ev.key==="Escape"){inp.value="";cerrar();inp.blur();}
      if(ev.key==="Enter"){const p=caja.querySelector(".bs-op");if(p)p.click();}});
    document.addEventListener("click",ev=>{if(!ev.target.closest(".busca-caja"))cerrar();});})();

  // ── 3 · TECLADO ─────────────────────────────────────────────────────────
  // Lo que separa una herramienta de una página: recorrer 215 indicadores sin
  // soltar el teclado. Se ignora mientras se escribe en un campo — si no, la
  // flecha abajo del buscador movería el mapa de atrás.
  addEventListener("keydown",ev=>{
    const t=ev.target;
    if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable))return;
    if(ev.ctrlKey||ev.metaKey||ev.altKey)return;
    const pos=INDS.findIndex(x=>x.key===cur.key);
    const ir=d=>{const n=INDS[(pos+d+INDS.length)%INDS.length];
      if(n){select(n);const el=document.querySelector(`.ind[data-k="${n.key}"]`);
        if(el)el.scrollIntoView({block:"nearest"});escribirURL(true);}};
    const anios=["2012","2024","cambio"];
    switch(ev.key){
      case "ArrowDown":ev.preventDefault();ir(1);break;
      case "ArrowUp":ev.preventDefault();ir(-1);break;
      case "[":case "ArrowLeft":ev.preventDefault();
        setAnio(anios[Math.max(0,anios.indexOf(ANIO)-1)]);escribirURL(true);break;
      case "]":case "ArrowRight":ev.preventDefault();
        setAnio(anios[Math.min(2,anios.indexOf(ANIO)+1)]);escribirURL(true);break;
      case "Escape":if(sel){ev.preventDefault();sel=null;drawOver();renderSummary();escribirURL(true);}break;
      case "/":ev.preventDefault();{const b=document.getElementById("busca");if(b)b.focus();}break;
    }});

  let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{layout();setSheet(isMob()?sheetState:"hidden");},120);});
  buildCards();renderCatDrop();updateHints();layout();termo();renderLamina();renderNational();
  // ── el estado de la URL se aplica DESPUÉS del primer pintado ──
  // Así el mapa aparece con la vista por defecto y se corrige, en vez de quedar
  // en blanco esperando; y si el hash trae basura, el Atlas ya está en pie.
  (function(){const e=leerURL();
    if(e){if(esRecarga())delete e.m;aplicarEstado(e);}
    _listo=true;escribirURL(false);})();
  // el censo de 2012 se baja SOLO, 1,2 s después del primer pintado: para cuando
  // alguien toque "2012" ya suele estar, y el arranque no pagó un byte por él.
  // Si lo tocan antes, `setAnio` espera esta misma promesa.
  setTimeout(()=>{pedir2012().catch(()=>{});},1200);
});
</script>
